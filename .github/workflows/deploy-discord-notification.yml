name: Deploy Discord application notifications

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/notify-discord/**"
      - ".github/workflows/deploy-discord-notification.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Set secure Discord webhook secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Add SUPABASE_ACCESS_TOKEN and DISCORD_WEBHOOK_URL in GitHub Actions secrets."
            exit 1
          fi
          supabase secrets set --yes --project-ref slvbjhoqjgtbttnvbuly "DISCORD_WEBHOOK_URL=$DISCORD_WEBHOOK_URL"
      - name: Deploy Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy notify-discord --project-ref slvbjhoqjgtbttnvbuly
